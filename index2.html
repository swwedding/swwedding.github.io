<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #fffdf9;
      --warm-bg: #f7f1eb;
      --ink: #3a312c;
      --muted: #8a7a72;
      --gold: #d6a83f;
      --border: #eadfd6;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background:
        linear-gradient(rgba(247, 241, 235, 0.84), rgba(247, 241, 235, 0.84)),
        url("roses-background.png");
      background-size: cover;
      background-position: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
    }

    .container {
      width: min(100%, 430px);
      text-align: center;
      padding: 3rem 2.25rem;
      background: rgba(255, 253, 249, 0.94);
      border: 1px solid var(--border);
      box-shadow: 0 22px 70px rgba(58, 49, 44, 0.12);
    }

    .flower {
      width: 92px;
      height: auto;
      margin-bottom: 1.6rem;
      opacity: 0.95;
    }

    .ornament {
      font-size: 0.7rem;
      letter-spacing: 0.45rem;
      color: var(--gold);
      margin-bottom: 1.4rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: normal;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    .ampersand {
      color: var(--gold);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .divider {
      width: 80px;
      height: 1px;
      background-color: var(--gold);
      margin: 1.5rem auto;
    }

    p {
      font-size: 1.02rem;
      letter-spacing: 0.08em;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .wip {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9f948c;
      border: 1px solid #d9cfc9;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      background: rgba(255, 253, 249, 0.6);
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .container {
        padding: 2.5rem 1.5rem;
      }

      .flower {
        width: 78px;
      }

      p {
        font-size: 0.92rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="ornament">&#10022; &#10022; &#10022;</div>

    <h1>S <span class="ampersand">&amp;</span> W</h1>

    <div class="divider"></div>

    <p>Something beautiful is coming soon.</p>
    <p>We can't wait to celebrate with you.</p>

    <span class="wip">Website in progress</span>
  </div>
</body>
</html>
